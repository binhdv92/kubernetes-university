apiVersion: v1
kind: Pod
metadata:
  name: pod-with-nfs-volume
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nfs-vol
      mountPath: /usr/share/nginx/html
  volumes:
  - name: nfs-vol
    nfs:
      server: 192.168.64.2
      path: /srv/nfs/share
      readOnly: false