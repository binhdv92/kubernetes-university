apiVersion: v1
kind: Pod
metadata:
  name: pod-nfs-pvc
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nfs-storage
      mountPath: /data
    - name: nfs-vol
      mountPath: /usr/share/nginx/html
  volumes:
  - name: nfs-storage
    persistentVolumeClaim:
      claimName: nfs-pvc
  - name: nfs-vol
    nfs:
      server: 192.168.64.2
      path: /srv/nfs/share
      readOnly: false