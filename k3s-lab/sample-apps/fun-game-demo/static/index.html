<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Kubernetes Snake</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: radial-gradient(circle at 50% 0%, #14213d 0%, #0a0e1a 70%);
    color: #e6f1ff;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  h1 {
    margin: 0;
    font-size: 1.6rem;
    letter-spacing: 0.5px;
  }
  h1 span { color: #39ff88; }
  #score {
    font-size: 1.1rem;
    font-variant-numeric: tabular-nums;
  }
  canvas {
    background: #0d1420;
    border: 2px solid #263354;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(57, 255, 136, 0.15);
  }
  #hint {
    font-size: 0.85rem;
    color: #8ea0c0;
  }
  #podinfo {
    margin-top: 4px;
    padding: 8px 14px;
    border-radius: 999px;
    background: #121a2c;
    border: 1px solid #263354;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 0.8rem;
    color: #9fd6ff;
  }
  #podinfo b { color: #39ff88; }
</style>
</head>
<body>
  <h1>🐍 Kubernetes <span>Snake</span></h1>
  <div id="score">Score: 0</div>
  <canvas id="board" width="400" height="400"></canvas>
  <div id="hint">Arrow keys / WASD to move &middot; Space to restart</div>
  <div id="podinfo">
    served by pod <b>__POD_NAME__</b> on node <b>__NODE_NAME__</b> (__POD_IP__)
    &mdash; reload to see it come from another pod
  </div>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

const GRID = 20;
const CELL = canvas.width / GRID;
const TICK_MS = 110;

let snake, dx, dy, food, score, alive, loopHandle;

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dx = 1;
  dy = 0;
  score = 0;
  alive = true;
  placeFood();
  scoreEl.textContent = "Score: 0";
  if (loopHandle) clearInterval(loopHandle);
  loopHandle = setInterval(tick, TICK_MS);
}

function placeFood() {
  while (true) {
    const candidate = {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID),
    };
    if (!snake.some((s) => s.x === candidate.x && s.y === candidate.y)) {
      food = candidate;
      return;
    }
  }
}

function tick() {
  if (!alive) return;

  const head = { x: snake[0].x + dx, y: snake[0].y + dy };

  const hitWall = head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
  const hitSelf = snake.some((s) => s.x === head.x && s.y === head.y);

  if (hitWall || hitSelf) {
    alive = false;
    clearInterval(loopHandle);
    draw();
    drawGameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 1;
    scoreEl.textContent = "Score: " + score;
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = "#0d1420";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#ff4d6d";
  ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);

  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? "#39ff88" : "#1fae5e";
    ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
  });
}

function drawGameOver() {
  ctx.fillStyle = "rgba(10, 14, 26, 0.75)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#e6f1ff";
  ctx.font = "bold 22px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Game Over — Score: " + score, canvas.width / 2, canvas.height / 2 - 10);
  ctx.font = "14px sans-serif";
  ctx.fillText("press Space to restart", canvas.width / 2, canvas.height / 2 + 18);
}

document.addEventListener("keydown", (e) => {
  const key = e.key.toLowerCase();

  if (key === " ") {
    e.preventDefault();
    if (!alive) reset();
    return;
  }

  const goingUp = dy === -1, goingDown = dy === 1, goingLeft = dx === -1, goingRight = dx === 1;

  if ((key === "arrowup" || key === "w") && !goingDown) { e.preventDefault(); dx = 0; dy = -1; }
  else if ((key === "arrowdown" || key === "s") && !goingUp) { e.preventDefault(); dx = 0; dy = 1; }
  else if ((key === "arrowleft" || key === "a") && !goingRight) { e.preventDefault(); dx = -1; dy = 0; }
  else if ((key === "arrowright" || key === "d") && !goingLeft) { e.preventDefault(); dx = 1; dy = 0; }
});

reset();
draw();
</script>
</body>
</html>
